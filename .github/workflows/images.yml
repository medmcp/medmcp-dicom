name: Image

# On push to main: build the dicom stack image on a NATIVE runner per architecture,
# push arch-suffixed tags, then merge them into a multi-arch manifest list so
# ghcr.io/medmcp/dicom:main resolves per-arch. Consumers keep using the bare tag.
# On pull_request: build both arches, no login-gated push and no merge.
#
# Each arch builds natively — do NOT collapse this into a single buildx
# --platform linux/amd64,linux/arm64 build. QEMU is far too slow for the CUDA/torch
# compiles in the GPU stacks, and the core repo's Images workflow sets the same
# precedent (medmcp#95).
#
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (Package settings -> Manage Actions access), and base:main must already be
# published as a multi-arch manifest (run medmcp's Images workflow first).
#
# NOTE: ubuntu-24.04-arm is free for public repos; private repos need a paid Team
# or Enterprise plan. Without one, swap that runner for a self-hosted aarch64 one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref, matching the other stacks. Builds here are short, so this
# saves little today; it stops a superseded push from racing the one that
# replaced it. Pull requests cancel; a push to main does not, because both arch
# legs have to finish for the merge job to assemble the manifest list.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the sibling arch on failure — a broken arm64 build should
      # still leave a diagnosable amd64 run, and vice versa.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Login on every event — needed to pull the private base, even for PR builds.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
          # Arch-suffixed: an internal handoff to the merge job, which folds these
          # into a manifest list under the bare :main / :<sha> tags. Nothing outside
          # this workflow should consume a suffixed tag.
          tags: |
            ghcr.io/medmcp/dicom:${{ github.sha }}-${{ matrix.arch }}
            ghcr.io/medmcp/dicom:main-${{ matrix.arch }}
          # Scope the cache per arch, or the two legs evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Runs once, after BOTH arches have pushed. Merging the per-arch images into a
  # manifest list is what makes the bare tag multi-arch; without this job the
  # suffixed tags exist but ghcr.io/medmcp/dicom:main would not.
  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge arch tags into multi-arch manifest lists
        run: |
          for tag in "${{ github.sha }}" main; do
            docker buildx imagetools create -t "ghcr.io/medmcp/dicom:$tag" \
              "ghcr.io/medmcp/dicom:$tag-amd64" \
              "ghcr.io/medmcp/dicom:$tag-arm64"
          done
      - name: Verify both platforms resolve
        run: |
          # Guards the failure this whole change exists to prevent: a tag that pulls
          # fine on the runner but cannot execute on the user's machine. The core
          # refuses a foreign-arch image at install, so a half-merged tag would make
          # the stack uninstallable rather than merely broken.
          insp=$(docker buildx imagetools inspect "ghcr.io/medmcp/dicom:main")
          echo "$insp"
          for plat in linux/amd64 linux/arm64; do
            echo "$insp" | grep -q "$plat" \
              || { echo "::error::ghcr.io/medmcp/dicom:main is missing $plat"; exit 1; }
          done
          echo "both platforms present"
